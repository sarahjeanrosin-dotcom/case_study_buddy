[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"

[functions."generate"]
  timeout = 26

[functions."generate-narrative"]
  timeout = 26

# Route all /api/* calls to Netlify Functions
[[redirects]]
  from = "/api/fetch-url"
  to = "/.netlify/functions/fetch-url"
  status = 200

[[redirects]]
  from = "/api/generate"
  to = "/.netlify/functions/generate"
  status = 200

[[redirects]]
  from = "/api/generate-narrative"
  to = "/.netlify/functions/generate-narrative"
  status = 200

[[redirects]]
  from = "/api/logo"
  to = "/.netlify/functions/logo"
  status = 200

[[redirects]]
  from = "/api/logos"
  to = "/.netlify/functions/logos"
  status = 200

[[redirects]]
  from = "/api/logo-proxy"
  to = "/.netlify/functions/logo-proxy"
  status = 200

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
